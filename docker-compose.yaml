services:
  redis:
    image: redis
    container_name: redis

    ports:
      - "6379:6397"

    networks:
      - backend-network

  postgres:
    image: postgres:16
    container_name: flow-postgres

    environment:
      POSTGRES_USER: POSTGRES
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: flow

    ports:
      - "5434:5432"

    volumes:
      - flow-postgres-data:/var/lib/postgresql/data

    networks:
      - backend-network

volumes:
  flow-postgres-data:

networks:
  backend-network:
    external: true